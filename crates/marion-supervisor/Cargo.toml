[package]
name = "marion-supervisor"
version.workspace = true
authors.workspace = true
description = "Run any agent harness as a subagent of any other, under one supervisor and one UI"
homepage = "https://github.com/RyanKim17920/marion"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "marion_supervisor"
path = "src/lib.rs"

[[bin]]
name = "marion-supervisor"
path = "src/main.rs"

# `client` is the viewer's half of this crate: the home screen, `marion attach`, the tree, the
# native facade's keyboard relay — everything that draws a terminal, and so everything that needs a
# terminal emulator and a TUI stack. The daemon uses none of it. On by default, so `cargo build`, `cargo install` and the dist
# release build both binaries exactly as before; `--no-default-features` builds the daemon (and the
# test targets that only drive it) without compiling alacritty, ratatui or the TUI at all.
[features]
default = ["client"]
client = ["dep:marion-term", "dep:marion-tui", "dep:ratatui"]

# The user-facing command (§10). One crate, two binaries: M1 has no socket between them, so
# sharing `run_spawn` by linkage is what keeps `marion run` and `marion-supervisor mcp` from
# drifting. The split lands with M2's detached supervisor.
[[bin]]
name = "marion"
path = "src/bin/marion.rs"
required-features = ["client"]

# The test targets that need the client half: each runs the `marion` binary
# (`CARGO_BIN_EXE_marion`), drives a screen, or reads a pane through the terminal emulator. Every
# other target — the lib's and the daemon's unit tests, `endpoint_matrix`, `repo_trust`,
# `token_off_argv`, `user_agent_types`, `git_env_scrub` — builds and runs with `--no-default-features` too.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
required-features = ["client"]

[[test]]
name = "it_canned"
path = "tests/it_canned/main.rs"
required-features = ["client"]

[[test]]
name = "it_live"
path = "tests/it_live/main.rs"
required-features = ["client"]

[[test]]
name = "l45_tree"
path = "tests/l45_tree.rs"
required-features = ["client"]

[dependencies]
# Search across runs scans its digest for every word at once, ASCII case folded, and finds a line's
# id and end by an exact key. Both were already in the build, through `globset` and `regex`.
aho-corasick = "1"
memchr = "2"
blake3 = "1"
getrandom = "0.4"
marion-core = { path = "../marion-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
marion-harness = { path = "../marion-harness" }
# The wire vocabulary (§10), for **one** type: `ReplayPoint`. §7.3.3 makes the replay-to-subscribe
# seam the correctness question of re-attach, and the registry is what computes the point. Declaring
# a second two-field struct here and converting at the handler is the "one derivation, two names"
# shape `run.rs` argues against — the conversion is exactly where the two would drift. No socket and
# no handler is built against this; see `registry.rs` for what the registry deliberately does *not*
# answer yet (`NodeSummary`, `AttachMode`) and why each would require fabricating a fact the journal
# does not carry.
marion-tui = { path = "../marion-tui", optional = true }
# The grid `marion attach` renders into (§9's M3 criterion C2). Not a widening of what the
# supervisor parses: `attach.rs` is the *client* half of this crate, the same binary by linkage for
# the same reason `marion run` and the bridge share `run_spawn`, and nothing on the supervisor side
# constructs a `Term` — the supervisor ships bytes (§5.3), and the emulator lives on the viewer's
# side of that seam.
marion-term = { path = "../marion-term", optional = true }
# For `marion_tui::ScreenBackend` alone — a `Terminal` has to be constructed somewhere, and this is
# the crate with the loop that draws. `default-features = false` for the same reason `marion-tui`
# and `marion-term` take it that way: none of the four shipped backends is wanted, and the one
# marion uses is its own.
ratatui = { version = "0.30", default-features = false, optional = true }
rustix = { version = "1", features = ["event", "fs", "net", "process", "termios"] }
# `trust` quotes the strings its refusals name with it, on the daemon's side; already in the build
# through `toml`.
toml_edit = "0.22"
# The node's screen as it stands, cell for cell, for the asks a pane's TUI raises mid-session
# (`pty::input`): a prompt is up while its footer, or its header and an option, are on the screen,
# which only a grid can say. Small and pure Rust, already in the build as marion-term's test emulator; the daemon
# takes it rather than alacritty, which stays on the client's side.
vt100 = "0.16"
# `profiles::ProfilesFile` reads `$XDG_CONFIG_HOME/marion/profiles.toml`, with the parser
# `.marion/agents.toml` is read with.
toml.workspace = true

# The macOS Keychain, read and written in-process so the item's access list trusts marion itself
# and not `/usr/bin/security`, which any same-user process can run (`credentials::Keychain`).
# macOS only: every other target builds without it.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

# A **dev**-dependency, not a dependency: only the end-to-end test starts a provider. Linking the
# canned provider into the user-facing `marion` binary would put a fake-model server inside the
# shipped command, and §5.5 keeps the provider a separate component precisely so the real endpoint
# can replace it. The e2e test drives it in-process so the run's request log is a value it can
# assert on directly.
[dev-dependencies]
marion-provider = { path = "../marion-provider" }

# `native_bootstrap`'s descriptor-passing tests make pipes; the crate itself never does, so the
# feature is asked for here rather than on the dependency the daemon links. Until `client` became
# optional it arrived unasked, through the TUI's own `rustix`.
rustix = { version = "1", features = ["pipe"] }

# A **dev**-dependency for the same reason and by the same rule: nothing in it belongs inside the
# shipped `marion` command — it kills processes by pid, removes directories on drop, and shells out
# to `git` and `ps`. It exists because Rust compiles every file in `tests/` as its own crate, so the
# suite could not share a helper without a mechanism, and the copies had not merely multiplied: the
# strong variant of `survivors` had failed to propagate to two of five call sites, leaving two files
# whose leak check could silently under-report. A `tests/common/mod.rs` would have reached the
# integration files and none of the guards inside this crate's own `#[cfg(test)]` modules; a
# dev-dependency reaches both.
marion-testsupport = { path = "../marion-testsupport" }

# L4.5's other half. §8 names `TestBackend` + `insta`, and `tests/l45_tree.rs` is the tree
# screen's driver — it lives in this crate because this is where the greying is decided, and a
# snapshot taken in `marion-tui` would be a snapshot of availability bits a test invented.
insta = "1"

# The one package cargo-dist ships (dist-workspace.toml). Every crate here is `publish = false`,
# which dist reads as "not for release" unless told otherwise; this one carries both user-facing
# binaries, `marion` and `marion-supervisor`, into a single archive, and the Homebrew formula is
# named for the command people type rather than for the crate.
[package.metadata.dist]
dist = true
# `marion` requires the `client` feature. It is a default feature, and this says so again for the
# release build, so the archive keeps carrying both binaries even if the default ever changes.
features = ["client"]
formula = "marion"
npm-package = "marion"

# `cargo binstall` fetches the dist archive for the host instead of compiling. The crate is not on
# crates.io (`publish = false`), so it is named by repository:
# `cargo binstall --git https://github.com/RyanKim17920/marion marion-supervisor`.
# The archive holds `marion-supervisor-<target>/{marion,marion-supervisor}`; `{ bin }` covers both.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
