[package]
name = "marion-supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "marion_supervisor"
path = "src/lib.rs"

[[bin]]
name = "marion-supervisor"
path = "src/main.rs"

# The user-facing command (§10). One crate, two binaries: M1 has no socket between them, so
# sharing `run_spawn` by linkage is what keeps `marion run` and `marion-supervisor mcp` from
# drifting. The split lands with M2's detached supervisor.
[[bin]]
name = "marion"
path = "src/bin/marion.rs"

[dependencies]
blake3 = "1"
getrandom = "0.4"
marion-core = { path = "../marion-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
marion-harness = { path = "../marion-harness" }
# The wire vocabulary (§10), for **one** type: `ReplayPoint`. §7.3.3 makes the replay-to-subscribe
# seam the correctness question of re-attach, and the registry is what computes the point. Declaring
# a second two-field struct here and converting at the handler is the "one derivation, two names"
# shape `run.rs` argues against — the conversion is exactly where the two would drift. No socket and
# no handler is built against this; see `registry.rs` for what the registry deliberately does *not*
# answer yet (`NodeSummary`, `AttachMode`) and why each would require fabricating a fact the journal
# does not carry.
marion-tui = { path = "../marion-tui" }
# The grid `marion attach` renders into (§9's M3 criterion C2). Not a widening of what the
# supervisor parses: `attach.rs` is the *client* half of this crate, the same binary by linkage for
# the same reason `marion run` and the bridge share `run_spawn`, and nothing on the supervisor side
# constructs a `Term` — the supervisor ships bytes (§5.3), and the emulator lives on the viewer's
# side of that seam.
marion-term = { path = "../marion-term" }
# For `marion_tui::ScreenBackend` alone — a `Terminal` has to be constructed somewhere, and this is
# the crate with the loop that draws. `default-features = false` for the same reason `marion-tui`
# and `marion-term` take it that way: none of the four shipped backends is wanted, and the one
# marion uses is its own.
ratatui = { version = "0.30", default-features = false }
rustix = { version = "1", features = ["fs", "net", "process", "termios"] }

# A **dev**-dependency, not a dependency: only the end-to-end test starts a provider. Linking the
# canned provider into the user-facing `marion` binary would put a fake-model server inside the
# shipped command, and §5.5 keeps the provider a separate component precisely so the real endpoint
# can replace it. The e2e test drives it in-process so the run's request log is a value it can
# assert on directly.
[dev-dependencies]
marion-provider = { path = "../marion-provider" }

# A **dev**-dependency for the same reason and by the same rule: nothing in it belongs inside the
# shipped `marion` command — it kills processes by pid, removes directories on drop, and shells out
# to `git` and `ps`. It exists because Rust compiles every file in `tests/` as its own crate, so the
# suite could not share a helper without a mechanism, and the copies had not merely multiplied: the
# strong variant of `survivors` had failed to propagate to two of five call sites, leaving two files
# whose leak check could silently under-report. A `tests/common/mod.rs` would have reached the
# integration files and none of the guards inside this crate's own `#[cfg(test)]` modules; a
# dev-dependency reaches both.
marion-testsupport = { path = "../marion-testsupport" }

# L4.5's other half. §8 names `TestBackend` + `insta`, and `tests/l45_tree.rs` is the tree
# screen's driver — it lives in this crate because this is where the greying is decided, and a
# snapshot taken in `marion-tui` would be a snapshot of availability bits a test invented.
insta = "1"
