[package]
name = "marion-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# Not merely a serializer since `proto` moved in: a JSON-RPC frame is classified by which keys it
# carries (`proto/envelope.rs`), and `Value` is also the honest type for the two payloads marion
# couriers rather than interprets — a harness's elicitation schema and a harness's own event body.
serde_json.workspace = true
thiserror.workspace = true
globset = "0.4"
# §4.3's `<project-hash>` is defined as BLAKE3; nothing else in the tree needs a hash, so this is
# the one dependency it buys.
blake3 = "1"
# `proto::pane` and `proto::native` carry opaque byte payloads on the wire.
base64.workspace = true

# Deliberately **not** a dependency: `marion-harness`. §3.3's `Capabilities` and
# `ExecutionSurfaces` would be the natural content of a `node/get` result, but `ExecutionSurfaces`
# lives there beside ~170 KB of per-harness adapter code, and a core crate that pulls in four
# harness adapters to name a boolean has inverted §10's dependency direction. See `proto/model.rs`
# for what `NodeSummary` therefore does not carry, and why that is an omission rather than a copy.
