[package]
name = "marion-harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marion-core = { path = "../marion-core" }
serde.workspace = true
serde_json.workspace = true
# codex's trust guard reads whether the operator's `config.toml` already states a trust for the
# checkout (`codex::live_trust_override`); `toml` is already in the lock through marion-core.
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test-only: the version gate's table, read by `tests/pinned_probe_env.rs` so the env its probe runs
# with cannot drift from the no-self-update env these rows give every node.
marion-testsupport = { path = "../marion-testsupport" }
