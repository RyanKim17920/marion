[package]
name = "marion-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marion-term = { path = "../marion-term" }
# The render path is `impl Widget for &Term`, which is marion-term's. This dependency is here for
# `view`, which sizes and clips that widget; nothing in this crate draws a cell itself.
ratatui = { version = "0.30", default-features = false }
serde_json.workspace = true
# Column widths for the home screen's layout (`home::text`): a prompt typed in CJK is two columns
# per character. Already in the tree through `ratatui`, at the same version.
unicode-width = "0.2"

[dev-dependencies]
# Snapshot tests for the home screen (`tests/home_screens.rs`), as `marion-term` and the tree
# screen's L4.5 driver use.
insta = "1"
