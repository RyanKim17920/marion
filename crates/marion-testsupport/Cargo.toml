[package]
name = "marion-testsupport"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "marion_testsupport"
path = "src/lib.rs"

[dependencies]
# For `paths::state_dir_from`: the gate reads conformance records under the same state directory the
# shipped `marion` uses, resolved by the same rule rather than a second spelling of it.
marion-core = { path = "../marion-core" }
# `getpwuid_r`, for the account's home: a test may rewrite `$HOME`, and the records must not move
# with it. Already in the lock through std's dependents.
libc = "0.2"
# For each pinned harness's verified versions, which are its row's (`HarnessSpec::verified`).
marion-harness = { path = "../marion-harness" }
serde_json.workspace = true

[dev-dependencies]
# The three-axis checks (`tests/three_axis/`) read the workspace's own source as a syntax tree, so
# "a `Harness::Codex` pattern outside the row files" or "a `thread::sleep` inside a loop" is a
# question about code, not about text: a doc comment or a string that merely mentions either is
# not a finding. syn 2 is already in the lock through serde_derive/thiserror; `full` and `visit`
# add the item/expression grammar and the walker. `span-locations` gives every finding a line.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
