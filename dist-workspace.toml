# Release configuration for cargo-dist (`dist`). `dist generate` turns this into
# .github/workflows/release.yml; edit this file and regenerate, never the workflow by hand.
# The one-time setup the owner does outside the repository is in CONTRIBUTING.md, "Releasing".

[workspace]
members = ["cargo:."]

[dist]
# The dist release that generated release.yml. Bump it with `dist init` after installing a newer
# dist, so the workflow and this file move together.
cargo-dist-version = "0.33.0"
ci = "github"
# A curl-able shell installer and a Homebrew formula. No updater: marion is updated by the same
# channel that installed it (brew upgrade, or re-running the installer), not by itself.
installers = ["shell", "homebrew"]
install-updater = false
tap = "RyanKim17920/homebrew-tap"
publish-jobs = ["homebrew"]
# macOS and glibc Linux, both architectures. No Windows (marion needs PTYs and Unix sockets) and
# no musl yet: nothing in CI has linked against it, so shipping it would be shipping a guess.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
# Pull requests get `dist plan` only: it checks this file and the workflow agree without spending
# four release builds on every push.
pr-run-mode = "plan"
