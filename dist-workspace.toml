# Release configuration for cargo-dist (`dist`). `dist generate` turns this into
# .github/workflows/release.yml; edit this file and regenerate, never the workflow by hand.
# The one-time setup the owner does outside the repository is in CONTRIBUTING.md, "Releasing".

[workspace]
members = ["cargo:."]

[dist]
# The dist release that generated release.yml. Bump it with `dist init` after installing a newer
# dist, so the workflow and this file move together.
cargo-dist-version = "0.33.0"
ci = "github"
# A curl-able shell installer, a Homebrew formula, and an npm package that downloads the archive
# for the platform it runs on. No updater: marion is updated by the same channel that installed it
# (brew upgrade, npm update, or re-running the installer), not by itself.
installers = ["shell", "homebrew", "npm"]
install-updater = false
tap = "RyanKim17920/homebrew-tap"
# Plain `marion` is taken on npm; the package is `@ryankim17920/marion` (npm-package is set on the
# crate, in crates/marion-supervisor/Cargo.toml).
npm-scope = "@ryankim17920"
# The formula and npm publish jobs are local copies of dist's own (.github/workflows/publish-*.yml)
# that skip with a notice when their secret is absent instead of failing the release. dist warns
# "a Homebrew tap was specified but the Homebrew publish job is disabled" because it cannot see
# that ./publish-homebrew is that job; the formula is still built and still names this tap.
publish-jobs = ["./publish-homebrew", "./publish-npm"]
# macOS, glibc Linux and musl Linux, both architectures. musl gives a static binary for Alpine and
# other non-glibc systems; both musl targets were cross-linked with cargo-zigbuild on macOS and are
# built natively on the release runners. No native Windows (marion needs POSIX PTYs and Unix
# sockets; see CONTRIBUTING.md, "Windows").
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
# Pull requests get `dist plan` only: it checks this file and the workflow agree without spending
# four release builds on every push.
pr-run-mode = "plan"
# Every build job signs a SLSA build-provenance attestation for the archives it produced, so a
# download can be checked with `gh attestation verify <file> --repo RyanKim17920/marion`.
github-attestations = true

# Every action release.yml uses, pinned to the full commit its tag named when it was resolved
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, dereferencing an annotated tag). A tag can be
# moved; a commit cannot. `dist generate` writes these into the workflow in place of the tag.
# Bump one by resolving the new tag the same way and regenerating.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
