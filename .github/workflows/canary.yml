# The nightly harness canary: does marion still work against the NEWEST release of every harness,
# and which of those releases can it list as verified without anyone's hand on it?
#
# ci.yml runs with no harness binaries at all (MARION_CI_NO_HARNESSES=1), so nothing else notices a
# harness release that breaks marion until an operator's machine auto-updates into it. This
# workflow looks first. Each night it:
#
#   1. installs the latest release of every harness that installs without a prompt or a login
#      (seven from npm, goose from Homebrew) — no credentials of any kind are configured;
#   2. reports which installed releases their rows' `verified` lists do not name (the harness_drift
#      example), and runs `marion-supervisor doctor --capabilities`;
#   3. runs the conformance battery — the basic tests, $0 against marion's canned provider — on
#      every unlisted release, judging each against the cells its newest verified release scored
#      in the committed matrix. Each verdict is recorded for that exact binary, and
#      `harness_drift --admitted` names the releases admitted;
#   4. runs the whole workspace suite STRICT: the gate passes a listed release, and an unlisted one
#      only on its admitting conformance record, so a release whose basics fail fails every test
#      that drives it, naming the harness, the version and the probes. MARION_CI_NO_HARNESSES stays
#      unset: a missing harness is a failure here, not a skip. The `--ignored` suites
#      (restart_resume, acp_child) spend real tokens and stay out;
#   5. after a wholly green run, `admit` adds every admitted release to its row's `verified` list
#      (`scripts/admit-harness.sh`) in one pull request — each npm release only once its publish
#      is NPM_COOLDOWN_DAYS old, each Homebrew one only as its formula's stable version, and only
#      if newer than the row's newest — set to auto-merge where the default branch has required
#      status checks, and otherwise left open for a person;
#   6. on red anywhere, opens or updates one issue labelled `harness-canary` with each release's
#      conformance verdict, the failing tests, their first panic lines and every harness version.
#
# What it cannot cover: anything behind a vendor login. The canned provider stands in for every
# model, so live cells (real model calls through the operator's own account) stay manual, as do the
# probes under spikes/ and the MILESTONES paragraphs a hand admission writes. Scheduled runs use
# the default branch.
#
# Trust split. Steps 1-4 execute code this repository does not control: the newest release of eight
# third-party packages, straight from npm and Homebrew, plus whatever their install scripts run. So
# they run in `run`, which holds a read-only token and keeps no credential in the checkout or its
# environment; what leaves it is an artifact of plain files and two job outputs. Treat the
# `admitted` output as chosen by an attacker: an install script can rewrite the checkout or the
# job's environment before harness_drift prints it. `admit` therefore checks it from its own
# checkout of the default branch: a strict `<harness> <version>` pattern; each npm release must
# exist on the registry and be NPM_COOLDOWN_DAYS old, each Homebrew release must be its formula's
# stable version, and a program from neither is refused; the list script refuses a harness with no
# row, a version not newer than the row's newest (no downgrade) and a program named twice; and
# only the row files the script names may change. It downloads nothing and runs only perl,
# rustfmt, npm view, brew info and gh. Even so, what it lists is a version string a person never
# read: CI on the pull request runs with no harness binaries and checks only that the edit builds,
# so the real gate is the checks above, not the branch's rules. The listed version reaches only
# the test gate and doctor's note — the shipped marion never refuses on it, and no test installs
# it.
# `admit` holds contents and pull-requests write and CANARY_TOKEN, `report` issues: write;
# neither runs anything installed.

name: Harness canary

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

# Every job starts from nothing and names what it needs.
permissions: {}

concurrency:
  group: harness-canary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # `<program>=<npm package>` for every harness installed from npm: what `run` installs, and what
  # `admit` asks the registry about before it lists a release.
  NPM_HARNESSES: >-
    claude=@anthropic-ai/claude-code codex=@openai/codex opencode=opencode-ai
    copilot=@github/copilot cline=cline qwen=@qwen-code/qwen-code
    pi=@earendil-works/pi-coding-agent
  # A release is listed only once its npm publish is this many days old: most hijacked npm
  # releases are caught and pulled inside that window.
  NPM_COOLDOWN_DAYS: 7
  # `<program>=<Homebrew formula>` for every harness installed from Homebrew: what `run` installs,
  # and what `admit` asks Homebrew about before it lists a release. A program in neither map is
  # never listed.
  BREW_HARNESSES: >-
    goose=block-goose-cli

defaults:
  run:
    shell: bash

jobs:
  # Installs and runs third-party code. Read-only; everything it learns leaves as the artifact.
  run:
    runs-on: macos-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      # Three cores: the cells carry 60 s bounds that a fully parallel run starves on a loaded box
      # (measured at the opencode 1.18.32 admission).
      RUST_TEST_THREADS: 3
    outputs:
      pairs: ${{ steps.drift.outputs.pairs }}
      admitted: ${{ steps.admitted.outputs.pairs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # A cache this job writes has had third-party code running beside it, so it lives under its
      # own prefix and ci.yml's jobs never restore it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-canary
      - name: Give git a committer identity
        run: |
          git config --global user.name "marion canary"
          git config --global user.email "canary@marion.invalid"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - name: Install the newest release of every harness
        run: |
          # shellcheck disable=SC2046
          npm install -g --no-fund --no-audit \
            $(for e in $NPM_HARNESSES; do printf '%s@latest ' "${e#*=}"; done)
          # shellcheck disable=SC2046
          brew install $(for e in $BREW_HARNESSES; do printf '%s ' "${e#*=}"; done)

      - name: Harness versions
        id: drift
        run: |
          cargo run -q -p marion-testsupport --example harness_drift > drift.txt 2> versions.txt
          cat versions.txt
          echo "pairs=$(tr '\n' ' ' < drift.txt | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      - name: marion doctor
        run: cargo run -q -p marion-supervisor --bin marion-supervisor -- doctor --capabilities 2>&1 | tee doctor.txt

      # The basic tests: the conformance battery on every unlisted release, against the cells its
      # newest verified release scored in the committed matrix. Each row's verdict lands in this
      # runner's state dir, keyed on the exact binary, and the strict gate below admits a release
      # on it. A cell that passed on the verified release and does not now fails this step; the
      # failure is held until the matrix has run, so one regressed harness does not hide what the
      # others did.
      - name: Conformance on the unlisted releases
        id: conformance
        if: steps.drift.outputs.pairs != ''
        continue-on-error: true
        env:
          PAIRS: ${{ steps.drift.outputs.pairs }}
          COPILOT_AUTO_UPDATE: "false"
        run: |
          set -o pipefail
          git show HEAD:tests/fixtures/conformance/matrix.json > "$RUNNER_TEMP/verified-matrix.json"
          # `<harness> <version> ...` -> `harness,harness`: the battery selects rows by program.
          # shellcheck disable=SC2086
          programs=$(printf '%s\n' $PAIRS | awk 'NR % 2 == 1' | paste -sd, -)
          MARION_CONFORMANCE="$programs" MARION_CONFORMANCE_BASELINE="$RUNNER_TEMP/verified-matrix.json" \
            cargo test -p marion-supervisor --test conformance -- battery --nocapture 2>&1 | tee conformance.log

      - name: Releases the basic tests admitted
        id: admitted
        if: steps.drift.outputs.pairs != ''
        run: |
          cargo run -q -p marion-testsupport --example harness_drift -- --admitted > admitted.txt 2> admitted-versions.txt
          cat admitted-versions.txt
          echo "pairs=$(tr '\n' ' ' < admitted.txt | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      # Strict: a listed release passes the gate, an unlisted one only on its conformance record,
      # and one whose basics failed fails every test that drives it, naming the probes.
      - name: Matrix against the installed releases
        env:
          # The whole root×child square in cross_product, which a default run trims.
          MARION_FULL_MATRIX: "1"
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee matrix.log

      - name: Fail on a conformance regression
        if: steps.conformance.outcome == 'failure'
        run: |
          echo "::error::the conformance battery regressed against the committed matrix; see conformance.log"
          exit 1

      - name: Canary issue body
        if: failure()
        env:
          PAIRS: ${{ steps.drift.outputs.pairs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          touch versions.txt admitted-versions.txt conformance.log matrix.log
          {
            echo "The nightly harness canary failed on $(date -u +%Y-%m-%d). Run: $RUN_URL"
            echo
            echo "Unlisted releases installed: \`${PAIRS:-none}\`"
            echo
            echo '### Installed versions, and what their basic tests said'
            echo '```'
            if [ -s admitted-versions.txt ]; then cat admitted-versions.txt; else cat versions.txt; fi
            echo '```'
            echo
            echo '### Conformance verdicts and regressions'
            echo '```'
            grep -hE '^conformance: .*admitted|regressions against|PASS -> ' conformance.log | head -n 100
            echo '```'
            echo
            echo '### Failing tests'
            echo '```'
            grep -hE '^test .* FAILED$|^error: test failed' matrix.log | sort -u | head -n 200
            echo '```'
            echo
            echo '### First panic of each'
            echo '```'
            grep -hA2 'panicked at' matrix.log | head -n 400
            echo '```'
          } | head -c 60000 > issue.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-report
          path: |
            versions.txt
            drift.txt
            doctor.txt
            conformance.log
            admitted.txt
            admitted-versions.txt
            matrix.log
            issue.md
          if-no-files-found: ignore

  # Lists the releases the basic tests admitted in their rows, opens (or updates) one pull request
  # with that commit and sets it to merge itself once main's rules pass. It takes nothing from
  # `run` but the pairs, checked below, and executes only this repository's own
  # `admit-harness.sh` (perl and rustfmt, no build) from its own checkout.
  admit:
    needs: run
    # Only after a wholly green run: a release that trips any test is not listed, whatever its
    # battery said, and the red reaches the issue through `report`.
    if: ${{ needs.run.result == 'success' && needs.run.outputs.admitted != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default branch's tip, not the commit `run` tested: the commit only adds versions to
      # lists, and the next run re-tests them on whatever the branch then holds.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: List the admitted releases
        id: list
        env:
          PAIRS: ${{ needs.run.outputs.admitted }}
        run: |
          # `<harness> <version>` pairs and nothing else: they reach a commit message and a title,
          # and the script refuses a harness that is not a pinned program.
          if ! [[ "$PAIRS" =~ ^[a-z]+\ [0-9]+(\.[0-9]+)+(\ [a-z]+\ [0-9]+(\.[0-9]+)+)*$ ]]; then
            echo "::error::admitted pairs from the run job are not <harness> <version> pairs"
            exit 1
          fi
          # The run job's output is chosen by whatever ran there, install scripts included, so
          # each release is checked from here against where `run` installed it from. An npm
          # release must exist and its publish be NPM_COOLDOWN_DAYS old; a younger one waits for
          # a later night. Homebrew states no publish time per version, so a formula's release
          # must be the one its stable version names. A program in neither map is refused: there
          # is nothing to check it against, so it is never listed.
          cutoff=$(date -u -d "-$NPM_COOLDOWN_DAYS days" +%s)
          brew=$(command -v brew || echo /home/linuxbrew/.linuxbrew/bin/brew)
          ready=""
          # shellcheck disable=SC2086
          set -- $PAIRS
          while [ $# -ge 2 ]; do
            h=$1 v=$2; shift 2
            pkg="" formula=""
            for e in $NPM_HARNESSES; do [ "${e%%=*}" = "$h" ] && pkg=${e#*=}; done
            for e in $BREW_HARNESSES; do [ "${e%%=*}" = "$h" ] && formula=${e#*=}; done
            if [ -n "$pkg" ]; then
              published=$(npm view "$pkg" time --json | jq -r --arg v "$v" '.[$v] // empty')
              if [ -z "$published" ]; then
                echo "::error::$pkg has no published $v"
                exit 1
              fi
              if [ "$(date -u -d "$published" +%s)" -gt "$cutoff" ]; then
                echo "$h $v: published $published, inside the ${NPM_COOLDOWN_DAYS}-day cooldown; not yet"
                continue
              fi
            elif [ -n "$formula" ]; then
              stable=$(HOMEBREW_NO_AUTO_UPDATE=1 "$brew" info --json=v2 "$formula" \
                | jq -r '.formulae[0].versions.stable // empty')
              if [ "$stable" != "$v" ]; then
                echo "::error::$formula's stable release is ${stable:-unknown}, not $v"
                exit 1
              fi
            else
              echo "::error::$h is installed from neither npm nor Homebrew, so $v cannot be checked"
              exit 1
            fi
            ready="$ready${ready:+ }$h $v"
          done
          if [ -z "$ready" ]; then
            echo "nothing is past its cooldown"
            exit 0
          fi
          # Word splitting of $ready is the point: it is `<harness> <version> ...`. The script
          # refuses a version not newer than the row's, and a program named twice.
          # shellcheck disable=SC2086
          scripts/admit-harness.sh $ready | tee "$RUNNER_TEMP/listed.txt"
          rows=$(sed -n 's/^admit-harness: .* listed in //p' "$RUNNER_TEMP/listed.txt" | sort -u)
          if [ "$(git diff --name-only | sort -u)" != "$rows" ]; then
            echo "::error::listing touched files other than the rows it named"
            exit 1
          fi
          {
            echo "pairs=$ready"
            echo "rows<<EOF"
            echo "$rows"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the admission pull request
        id: pr
        if: steps.list.outputs.pairs != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # A pull request opened with the default token does not start ci.yml, so one whose
          # merge waits on CI never merges; a CANARY_TOKEN (a token with contents and
          # pull-requests write) makes it start. See CONTRIBUTING.md.
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          branch: canary/admit-harnesses
          delete-branch: true
          add-paths: ${{ steps.list.outputs.rows }}
          commit-message: |
            test: admit ${{ steps.list.outputs.pairs }} to the verified harness releases

            The nightly canary installed these releases, and the conformance
            battery admitted each exact binary: every probe its newest verified
            release passed in the committed matrix passed again.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          title: "test: admit ${{ steps.list.outputs.pairs }} to the verified harness releases"
          body: |
            The nightly canary's conformance battery admitted these releases: every probe their
            newest verified release passed in the committed matrix passed again on the exact binary
            installed, each npm release is past its publish cooldown, each Homebrew release is its
            formula's stable version, and the whole canary run was green. This adds them to their
            rows' `verified` lists. CI on this pull request only checks that the edit builds; it
            does not drive the harnesses.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Auto-merge only where the default branch has required status checks to wait on. With none,
      # the pull request is left open for a person: merging at once would bypass every check.
      - name: Merge it once the rules pass
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.CANARY_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          checks=$(gh api "repos/$GH_REPO/rules/branches/$BRANCH" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "${checks:-0}" -gt 0 ]; then
            gh pr merge "$NUMBER" --squash --auto
          else
            echo "::notice::$BRANCH has no required status checks; pull request $NUMBER is left for a person to merge"
          fi

  # Opens or comments on the canary issue from the artifact when either job above failed. Runs
  # nothing from `run`.
  report:
    needs: [run, admit]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      # A failure with no test report (`run` died before writing one, or `admit` failed) still gets
      # an issue, with a shorter body.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: canary-report
          path: ${{ runner.temp }}/report
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/report
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          if [ -s "$REPORT/issue.md" ]; then
            head -c 60000 "$REPORT/issue.md" > "$body"
          else
            echo "The nightly harness canary failed on $(date -u +%Y-%m-%d) without a test report: the run stopped before the matrix finished, or opening the admission pull request failed. Run: $RUN_URL" > "$body"
          fi
          gh label create harness-canary --color B60205 \
            --description "Opened by the nightly harness canary" --force
          number=$(gh issue list --label harness-canary --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "Harness canary failing" --label harness-canary --body-file "$body"
          fi
