[workspace]
resolver = "3"
members = [
    "crates/marion-core",
    "crates/marion-provider",
    "crates/marion-supervisor",
    "crates/marion-harness",
    "crates/marion-term",
    "crates/marion-testsupport",
    "crates/marion-tui",
]

[workspace.package]
# One version for the whole workspace: `marion --version` and `marion-supervisor --version`
# print it, and the two binaries must always ship as a pair.
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
# Inherited by every member crate. `publish = false`: marion is one workspace of
# seven internal crates, none of which is a library anybody depends on from
# crates.io, and an accidental `cargo publish` would claim seven names.
license = "MIT"
repository = "https://github.com/RyanKim17920/marion"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The one file format marion reads for itself: `.marion/agents.toml` (`marion_core::agent_type`).
# Parse only; nothing writes TOML.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# The profile `dist build` compiles release artifacts with (see dist-workspace.toml).
[profile.dist]
inherits = "release"
# Size and speed of what ships, paid for once at release time: whole-program LTO in one codegen
# unit, and no symbol table in the binary (a crash report still names the panic site; the message
# and location are data, not symbols).
lto = "fat"
codegen-units = 1
strip = true
# Stated rather than inherited, because it is load-bearing: the supervisor catches a panic in a
# handler, a pane producer or an outbound flow with `catch_unwind` and keeps serving (§5.7).
# `panic = "abort"` would turn each of those into the supervisor's death.
panic = "unwind"
