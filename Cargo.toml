[workspace]
resolver = "3"
members = [
    "crates/marion-core",
    "crates/marion-proto",
    "crates/marion-provider",
    "crates/marion-supervisor",
    "crates/marion-harness",
    "crates/marion-testsupport",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
